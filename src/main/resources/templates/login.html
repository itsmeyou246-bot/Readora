<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>READORA | Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>


<body>

<div class="login-page">


    <!-- ================= LEFT SIDE ================= -->

    <div class="login-image">

        <img th:src="@{/img/library.png}"
             alt="Reading in Library">

        <div class="image-overlay"></div>


        <!-- Logo -->

        <div class="logo">
            READORA
        </div>


        <!-- Bottom Text -->

        <div class="image-content">

            <h2>
                Cultivating intellectual clarity.
            </h2>

            <p>
                Immerse yourself in carefully curated
                long-form editorial, distinct voices and
                profound narratives.
            </p>

        </div>

    </div>



    <!-- ================= RIGHT SIDE ================= -->

    <div class="login-section">

        <div class="login-box">


            <!-- Heading -->

            <div class="login-header">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Please enter your details to access your library.
                </p>

            </div>



            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                required
                        >

                    </div>

                    <small id="emailError"></small>

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                                type="password"
                                id="password"
                                placeholder="••••••••"
                                required
                        >

                        <button
                                type="button"
                                class="show-password"
                                id="togglePassword"
                                aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>



                <!-- ================= ROLE ================= -->

                <div class="form-group">

                    <label for="role">
                        Sign in as
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user-tag"></i>

                        <select
                                id="role"
                                aria-label="Choose workspace">

                            <option value="user">
                                Reader
                            </option>

                            <option value="author">
                                Author
                            </option>

                            <option value="admin">
                                Administrator
                            </option>

                        </select>

                    </div>

                    <small id="roleError"></small>

                </div>



                <!-- ================= REMEMBER / FORGOT ================= -->

                <div class="login-options">

                    <label class="remember">

                        <input
                                type="checkbox"
                                id="remember">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#"
                       class="forgot">

                        Forgot password?

                    </a>

                </div>



                <!-- ================= LOGIN BUTTON ================= -->

                <button
                        type="submit"
                        class="login-btn"
                        id="loginButton">

                    Login

                </button>


            </form>



            <!-- ================= SIGNUP ================= -->

            <div class="signup-link">

                <span>
                    Don't have an account?
                </span>

                <a th:href="@{/signup}">
                    Create one
                </a>

            </div>


        </div>

    </div>

</div>



<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>


    // =========================================================
    // PASSWORD SHOW / HIDE
    // =========================================================

    const togglePassword =
        document.getElementById("togglePassword");

    const passwordInput =
        document.getElementById("password");


    togglePassword.addEventListener(
        "click",
        function () {

            const icon =
                this.querySelector("i");


            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            }

            else {

                passwordInput.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

            }

        }
    );



    // =========================================================
    // LOGIN FORM
    // =========================================================

    const loginForm =
        document.getElementById("loginForm");


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // -------------------------------------------------
            // GET VALUES
            // -------------------------------------------------

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const role =
                document
                    .getElementById("role")
                    .value;



            // -------------------------------------------------
            // ERROR ELEMENTS
            // -------------------------------------------------

            const emailError =
                document.getElementById("emailError");


            const passwordError =
                document.getElementById("passwordError");


            const roleError =
                document.getElementById("roleError");


            emailError.textContent = "";

            passwordError.textContent = "";

            roleError.textContent = "";



            // -------------------------------------------------
            // VALIDATION
            // -------------------------------------------------

            let valid = true;


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                emailError.textContent =
                    "Please enter a valid email address.";

                valid = false;

            }


            if (password.length === 0) {

                passwordError.textContent =
                    "Please enter your password.";

                valid = false;

            }


            if (!role) {

                roleError.textContent =
                    "Please select your role.";

                valid = false;

            }



            // Stop if validation fails

            if (!valid) {

                return;

            }



            // -------------------------------------------------
            // DISABLE LOGIN BUTTON
            // -------------------------------------------------

            const loginButton =
                document.getElementById("loginButton");


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";



            // -------------------------------------------------
            // SEND LOGIN REQUEST TO SPRING BOOT
            // -------------------------------------------------

            try {

                const response =
                    await fetch("/api/auth/login", {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email,

                            password: password,

                            role: role

                        })

                    });



                // -------------------------------------------------
                // READ SERVER RESPONSE
                // -------------------------------------------------

                const data =
                    await response.json()
                        .catch(() => null);



                // -------------------------------------------------
                // LOGIN SUCCESS
                // -------------------------------------------------

                if (response.ok) {


                    // Save logged-in user information

                    localStorage.setItem(
                        "readoraUser",
                        JSON.stringify(data)
                    );


                    localStorage.setItem(
                        "readoraActiveRole",
                        data.role
                    );



                    // Success message

                    alert(
                        "Login successful! Welcome to READORA."
                    );



                    // -------------------------------------------------
                    // REDIRECT BASED ON ROLE
                    // -------------------------------------------------

                    if (data.role === "ADMIN") {

                        window.location.href =
                            "admin-dashboard.html";

                    }

                    else if (data.role === "AUTHOR") {

                        window.location.href =
                            "author-dashboard.html";

                    }

                    else {

                        window.location.href =
                            "dashboard.html";

                    }

                }



                    // -------------------------------------------------
                    // LOGIN FAILED
                // -------------------------------------------------

                else {

                    let errorMessage =
                        "Login failed. Please check your details.";


                    if (typeof data === "string") {

                        errorMessage = data;

                    }

                    else if (data && data.message) {

                        errorMessage = data.message;

                    }


                    alert(errorMessage);


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                }

            }



                // -------------------------------------------------
                // SERVER / NETWORK ERROR
                // -------------------------------------------------

            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                alert(
                    "Unable to connect to READORA server. " +
                    "Please make sure Spring Boot is running."
                );


                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>


</body>

</html>
