<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>READORA | Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">
</head>

<body>

<div class="login-page">

    <!-- LEFT SIDE -->

    <div class="login-image">

        <img th:src="@{/img/library.png}"
             alt="Reading in Library">

        <div class="image-overlay"></div>

        <div class="logo">
            READORA
        </div>

        <div class="image-content">

            <h2>
                Cultivating intellectual clarity.
            </h2>

            <p>
                Immerse yourself in carefully curated
                long-form editorial, distinct voices and
                profound narratives.
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="login-section">

        <div class="login-box">

            <div class="login-header">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Please enter your details to access your library.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                        >

                    </div>

                    <small id="emailError"></small>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                                type="password"
                                id="password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                required
                        >

                        <button
                                type="button"
                                class="show-password"
                                id="togglePassword"
                                aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>


                <div class="form-group">

                    <label for="role">
                        Sign in as
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user-tag"></i>

                        <select
                                id="role"
                                aria-label="Choose workspace"
                                required>

                            <option value="user">
                                Reader
                            </option>

                            <option value="author">
                                Author
                            </option>

                            <option value="admin">
                                Administrator
                            </option>

                        </select>

                    </div>

                    <small id="roleError"></small>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                                type="checkbox"
                                id="remember">

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#"
                       class="forgot"
                       id="forgotPassword">

                        Forgot password?

                    </a>

                </div>


                <button
                        type="submit"
                        class="login-btn"
                        id="loginButton">

                    Login

                </button>

            </form>


            <div class="signup-link">

                <span>
                    Don't have an account?
                </span>

                <a th:href="@{/signup}">
                    Create one
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    document.addEventListener("DOMContentLoaded", function () {

        const togglePassword =
            document.getElementById("togglePassword");

        const passwordInput =
            document.getElementById("password");

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");


        /*
         * Show and hide password
         */

        togglePassword.addEventListener("click", function () {

            const icon = this.querySelector("i");

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

                this.setAttribute("aria-label", "Hide password");

            } else {

                passwordInput.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

                this.setAttribute("aria-label", "Show password");

            }

        });


        /*
         * Forgot password
         */

        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {

                event.preventDefault();

                alert("Please contact READORA support to reset your password.");

            });


        /*
         * Login form
         */

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            const role =
                document.getElementById("role")
                    .value;


            const emailError =
                document.getElementById("emailError");

            const passwordError =
                document.getElementById("passwordError");

            const roleError =
                document.getElementById("roleError");


            emailError.textContent = "";
            passwordError.textContent = "";
            roleError.textContent = "";


            let valid = true;

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                emailError.textContent =
                    "Please enter a valid email address.";

                valid = false;

            }


            if (password.trim().length === 0) {

                passwordError.textContent =
                    "Please enter your password.";

                valid = false;

            }


            if (!role) {

                roleError.textContent =
                    "Please select your role.";

                valid = false;

            }


            if (!valid) {
                return;
            }


            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                const response =
                    await fetch("/api/auth/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },

                        /*
                         * This is required when Spring Boot
                         * sends the JWT through a cookie.
                         */
                        credentials: "same-origin",

                        body: JSON.stringify({

                            email: email,
                            password: password,
                            role: role

                        })

                    });


                const responseText =
                    await response.text();

                let data = null;

                try {

                    data =
                        responseText
                            ? JSON.parse(responseText)
                            : null;

                } catch (parseError) {

                    data = responseText;

                }


                if (!response.ok) {

                    let errorMessage =
                        "Login failed. Please check your details.";

                    if (typeof data === "string" && data.trim()) {

                        errorMessage = data;

                    } else if (data && data.message) {

                        errorMessage = data.message;

                    } else if (data && data.error) {

                        errorMessage = data.error;

                    }

                    alert(errorMessage);

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";

                    return;
                }


                /*
                 * Extract user information.
                 */

                const userData =
                    data && typeof data === "object"
                        ? data.user || data.data || data
                        : {};


                /*
                 * Extract JWT if the backend returns it
                 * in the JSON response.
                 *
                 * If the backend uses an HttpOnly cookie,
                 * token will be null. That is acceptable,
                 * because the browser automatically sends
                 * the cookie with future same-origin requests.
                 */

                const token =
                    (data && data.token) ||
                    (data && data.accessToken) ||
                    (data && data.access_token) ||
                    (data && data.jwt) ||
                    (userData && userData.token) ||
                    (userData && userData.accessToken) ||
                    (userData && userData.access_token) ||
                    (userData && userData.jwt) ||
                    null;


                /*
                 * Normalize the role.
                 */

                const returnedRole =
                    String(
                        userData.role ||
                        data.role ||
                        role
                    ).toUpperCase();


                /*
                 * Save login information.
                 *
                 * Important:
                 * The token is saved when the backend returns
                 * a token in JSON.
                 *
                 * If the backend uses an HttpOnly cookie,
                 * the cookie is handled automatically by the browser.
                 */

                const loggedInUser = {

                    id:
                        userData.id ||
                        data.id ||
                        null,

                    name:
                        userData.name ||
                        userData.fullName ||
                        data.name ||
                        data.fullName ||
                        email,

                    email:
                        userData.email ||
                        data.email ||
                        email,

                    role:
                    returnedRole,

                    token:
                    token

                };


                localStorage.setItem(
                    "readoraUser",
                    JSON.stringify(loggedInUser)
                );


                localStorage.setItem(
                    "readoraActiveRole",
                    returnedRole
                );


                /*
                 * Save token under an additional common key
                 * when the backend returns a JWT in JSON.
                 */

                if (token) {

                    localStorage.setItem(
                        "accessToken",
                        token
                    );

                }


                /*
                 * Clear any old expired login information.
                 */

                sessionStorage.removeItem("readoraUser");


                console.log("Login successful.");
                console.log("Logged-in user:", loggedInUser);
                console.log("JWT returned by server:", Boolean(token));


                /*
                 * Redirect based on role.
                 */

                if (returnedRole === "ADMIN") {

                    window.location.href =
                        "/admin-dashboard";

                } else if (returnedRole === "AUTHOR") {

                    window.location.href =
                        "/author-dashboard";

                } else if (returnedRole === "USER") {

                    window.location.href =
                        "/dashboard";

                } else {

                    alert("Invalid user role.");

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";

                }

            } catch (error) {

                console.error("Login error:", error);

                alert(
                    "Unable to connect to READORA server. " +
                    "Please make sure Spring Boot is running."
                );

                loginButton.disabled = false;
                loginButton.textContent = "Login";

            }

        });

    });

</script>

</body>

</html>
