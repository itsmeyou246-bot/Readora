<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="header">
    <style>
        .legacy-chrome-header,
        .legacy-chrome-footer {
            display: none !important;
        }

        .readora-global-header {
            border-bottom: 1px solid #ddd4c0;
            padding: 16px 0;
            background: #faf6ee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .readora-global-header .readora-header-inner,
        .readora-global-footer .readora-footer-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .readora-global-header .readora-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .readora-global-header .readora-logo,
        .readora-global-footer .readora-footer-logo {
            color: #201d18;
            font-family: Fraunces, Georgia, serif;
            font-weight: 600;
            text-decoration: none;
        }

        .readora-global-header .readora-logo {
            font-size: 22px;
            letter-spacing: 1.5px;
        }

        .readora-global-header .readora-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .readora-global-header .readora-nav a,
        .readora-global-footer .readora-footer-links a {
            color: #55503f;
            text-decoration: none;
            text-transform: uppercase;
        }

        .readora-global-header .readora-nav a {
            padding: 6px 0;
            font: 500 12.5px Inter, sans-serif;
            letter-spacing: .8px;
        }

        .readora-global-header .readora-nav a:hover,
        .readora-global-footer .readora-footer-links a:hover {
            color: #201d18;
        }

        .readora-global-header .readora-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .readora-global-header .readora-cart-link,
        .readora-global-header .readora-profile-link {
            color: #55503f;
            text-decoration: none;
            font-size: 13px;
        }

        .readora-global-header .readora-cart-link {
            position: relative;
        }

        .readora-global-header .readora-cart-count {
            position: absolute;
            top: -9px;
            right: -10px;
            min-width: 15px;
            padding: 2px 4px;
            border-radius: 10px;
            background: #2f4a3a;
            color: #faf6ee;
            font: 9px Inter, sans-serif;
            text-align: center;
        }

        .readora-global-header .readora-profile-link {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd4c0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .readora-global-footer {
            border-top: 1px solid #ddd4c0;
            padding: 30px 0;
            background: #faf6ee;
        }

        .readora-global-footer .readora-footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .readora-global-footer .readora-footer-logo {
            font-size: 15px;
        }

        .readora-global-footer .readora-footer-copy {
            color: #948d78;
            font: 12px Inter, sans-serif;
        }

        .readora-global-footer .readora-footer-links {
            display: flex;
            gap: 24px;
        }

        .readora-global-footer .readora-footer-links a {
            font: 11px Inter, sans-serif;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .readora-global-header .readora-header-inner {
                padding: 0 20px;
            }

            .readora-global-header .readora-nav {
                display: none;
            }
        }
    </style>
    <header class="readora-global-header">
        <div class="readora-header-inner">
            <a class="readora-logo" th:href="@{/index}">READORA</a>
            <nav class="readora-nav">
                <a th:href="@{/index}">Discover</a>
                <a th:href="@{/Book}">Books</a>
                <a th:href="@{/newspapers}">Newspapers</a>
                <a th:href="@{/magazines}">Magazines</a>
                <a th:href="@{/read-nepal}">Read Nepal</a>
                <a th:href="@{/library}">My Library</a>
            </nav>
            <div class="readora-header-actions">
                <a class="readora-cart-link" th:href="@{/cart}" aria-label="Cart">
                    <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                    <span class="readora-cart-count" data-cart-count hidden>0</span>
                </a>
                <a class="readora-profile-link" th:href="@{/login}" aria-label="Profile">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </header>
</th:block>

<th:block th:fragment="footer">
    <footer class="readora-global-footer">
        <div class="readora-footer-inner">
            <div class="readora-footer-logo">READORA</div>
            <div class="readora-footer-copy">© 2026 Readora. Cultivating intellectual clarity.</div>
            <div class="readora-footer-links">
                <a th:href="@{/Book}">Archives</a>
                <a th:href="@{/library}">Authors</a>
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
                <a href="#">Support</a>
            </div>
        </div>
    </footer>
</th:block>

</html>
