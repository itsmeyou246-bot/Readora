<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books & Catalog · READORA Admin</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --forest: #1b3022;
            --dark: #122017;
            --gold: #c5a059;
            --ivory: #fcf9f8;
            --sand: #f6f3f2;
            --border: #e5ded9;
            --text: #211f1d;
            --muted: #706b67;
        }

        body {
            background: var(--ivory);
            color: var(--text);
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }

        /* ================= HEADER ================= */

        .header {
            height: 64px;
            background: var(--ivory);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1400px;
            height: 100%;
            margin: auto;
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--forest);
            letter-spacing: 0.3px;
        }

        .admin-badge {
            background: var(--forest);
            color: white;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 9px;
            border-radius: 5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 26px;
            flex: 1;
        }

        .nav-links a {
            font-size: 13.5px;
            color: var(--muted);
            padding: 22px 0 20px;
        }

        .nav-links a:hover { color: var(--forest); }

        .nav-links a.active {
            color: var(--forest);
            font-weight: 600;
            border-bottom: 2px solid var(--forest);
        }

        .header-search {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--sand);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            width: 260px;
            color: var(--muted);
            font-size: 12.5px;
        }

        .header-search i { font-size: 12px; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .reader-view-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--sand);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .bell {
            position: relative;
            color: var(--muted);
            font-size: 15px;
        }

        .bell .dot {
            position: absolute;
            top: -3px; right: -3px;
            width: 7px; height: 7px;
            background: #c0503f;
            border-radius: 50%;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--forest);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .profile-info {
            line-height: 1.3;
        }

        .profile-info strong {
            display: block;
            font-size: 12.5px;
        }

        .profile-info small {
            color: var(--muted);
            font-size: 9.5px;
            letter-spacing: 0.4px;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px 28px 70px;
        }

        .page-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            gap: 20px;
        }

        .page-head h1 {
            font-family: "Playfair Display", serif;
            font-size: 34px;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .page-head p {
            color: var(--muted);
            font-size: 13.5px;
        }

        .page-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .btn-ghost {
            background: white;
            color: var(--text);
        }

        .btn-primary {
            background: var(--forest);
            color: white;
            border-color: var(--forest);
        }

        /* ================= STAT CARDS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .stat-top i { color: var(--gold); font-size: 13px; }

        .stat-value {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .stat-sub {
            font-size: 11.5px;
            color: var(--muted);
        }

        .stat-sub .up { color: #3f7a4e; font-weight: 700; }

        .stat-bar {
            margin-top: 10px;
            height: 5px;
            border-radius: 4px;
            background: var(--sand);
            overflow: hidden;
        }

        .stat-bar div {
            height: 100%;
            background: var(--forest);
            border-radius: 4px;
        }

        /* ================= FILTER PANEL ================= */

        .filter-panel {
            background: var(--sand);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 22px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: white;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .filter-tab.active {
            background: var(--forest);
            color: white;
            border-color: var(--forest);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 170px 170px 170px;
            gap: 10px;
        }

        .filter-row input,
        .filter-row select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            font-size: 12.5px;
            font-family: inherit;
            color: var(--text);
        }

        .filter-row .search-input {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
        }

        .filter-row .search-input i { color: var(--muted); font-size: 12px; }

        .filter-row .search-input input {
            border: none;
            padding: 11px 0;
        }

        /* ================= TABLE ================= */

        .table-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--muted);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--sand);
        }

        tbody td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            font-size: 13px;
        }

        tbody tr:last-child td { border-bottom: none; }

        .cover-thumb {
            width: 42px;
            height: 56px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Playfair Display", serif;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: white;
            text-align: center;
            line-height: 1.2;
        }

        .cover-forest { background: var(--forest); }
        .cover-dark { background: #2b2b2b; }
        .cover-draft { background: var(--sand); color: var(--muted); border: 1px dashed var(--border); }

        .title-cell strong {
            display: block;
            font-size: 13.5px;
            margin-bottom: 3px;
        }

        .title-cell small {
            color: var(--muted);
            font-size: 11px;
        }

        .author-cell strong {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .author-cell strong i { color: var(--forest); font-size: 10px; }

        .author-cell small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .category-pill {
            display: inline-block;
            background: var(--sand);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11.5px;
        }

        .price-cell strong {
            display: block;
            font-size: 13.5px;
        }

        .price-cell small {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--muted);
            margin-top: 2px;
        }

        .price-cell.premium small { color: var(--gold); }
        .price-cell.free strong { color: #3f7a4e; }
        .price-cell.free small { color: #3f7a4e; }
        .price-cell.unassigned strong { color: var(--muted); }

        .format-cell small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .status-pill i { font-size: 6px; }

        .status-published { background: #e7f2e9; color: #3f7a4e; }
        .status-pending { background: #fbf1de; color: #a87a2c; }
        .status-draft { background: var(--sand); color: var(--muted); }

        .row-actions {
            display: flex;
            gap: 8px;
        }

        .row-actions button {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .row-actions button:hover { background: var(--sand); }

        /* ================= PAGINATION ================= */

        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination a,
        .pagination span {
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .pagination a:hover { background: var(--sand); }

        .pagination .current {
            background: var(--forest);
            color: white;
            font-weight: 700;
        }

        @media (max-width: 1100px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .filter-row { grid-template-columns: 1fr; }
            .nav-links, .header-search { display: none; }
        }
    </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header th:replace="~{fragments/header :: adminHeader('books')}"></header>


<!-- ================= MAIN ================= -->
<main class="container">

    <div class="page-eyebrow">REPOSITORY &amp; INVENTORY</div>

    <div class="page-head">
        <div>
            <h1>Books</h1>
            <p>Manage all books available on READORA.</p>
        </div>

        <div class="page-actions">
            <button class="btn btn-ghost">
                <i class="fa-solid fa-arrow-down-to-line"></i>
                Export CSV
            </button>
            <a class="btn btn-primary" th:href="@{/admin/books/add}">
                <i class="fa-solid fa-plus"></i>
                Add Book
            </a>
        </div>
    </div>


    <!-- ================= STATS ================= -->
    <div class="stats">

        <div class="stat-card">
            <div class="stat-top">
                TOTAL BOOKS
                <i class="fa-solid fa-book-open"></i>
            </div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-sub" id="statTotalSub">Loading…</div>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                PUBLISHED
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="stat-value" id="statPublished">0</div>
            <div class="stat-bar"><div id="statPublishedBar" style="width:0%"></div></div>
            <div class="stat-sub" id="statPublishedSub" style="margin-top:8px;">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                DRAFTS &amp; IN-REVIEW
                <i class="fa-solid fa-clock"></i>
            </div>
            <div class="stat-value" id="statDraftPending">0</div>
            <div class="stat-sub" id="statDraftPendingSub">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-top">
                PREMIUM CATALOG
                <i class="fa-solid fa-medal"></i>
            </div>
            <div class="stat-value" id="statPremium">0</div>
            <div class="stat-bar"><div id="statPremiumBar" style="width:0%"></div></div>
            <div class="stat-sub" id="statPremiumSub" style="margin-top:8px;">—</div>
        </div>

    </div>


    <!-- ================= FILTERS ================= -->
    <div class="filter-panel">

        <div class="filter-tabs">
            <button class="filter-tab active" data-status="all">ALL</button>
            <button class="filter-tab" data-status="published">PUBLISHED</button>
            <button class="filter-tab" data-status="draft">DRAFT</button>
            <button class="filter-tab" data-status="scheduled">SCHEDULED</button>
            <button class="filter-tab" data-status="premium">PREMIUM</button>
            <button class="filter-tab" data-status="free">FREE</button>
        </div>

        <div class="filter-row">
            <div class="search-input">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search books by title, author...">
            </div>
            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
            <select id="languageFilter">
                <option value="">Language: All</option>
            </select>
            <select disabled>
                <option>Filter by Author (coming soon)</option>
            </select>
        </div>

    </div>


    <!-- ================= TABLE ================= -->
    <div class="table-card">

        <table>
            <thead>
            <tr>
                <th>Cover</th>
                <th>Title &amp; Identity</th>
                <th>Author</th>
                <th>Category</th>
                <th>Access / Price</th>
                <th>Format</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="booksTableBody">
            <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">Loading books…</td></tr>
            </tbody>
        </table>

        <div class="table-footer">
            <span id="tableFooterText">Loading…</span>
        </div>

    </div>

</main>

<script>
    let allBooks = [];
    let activeStatusFilter = "all";

    document.addEventListener("DOMContentLoaded", function () {
        loadBooks();
        document.getElementById("searchInput").addEventListener("input", renderTable);
        document.getElementById("categoryFilter").addEventListener("change", renderTable);
        document.getElementById("languageFilter").addEventListener("change", renderTable);

        document.querySelectorAll(".filter-tab").forEach(function (tab) {
            tab.addEventListener("click", function () {
                document.querySelectorAll(".filter-tab").forEach(function (t) { t.classList.remove("active"); });
                tab.classList.add("active");
                activeStatusFilter = tab.getAttribute("data-status");
                renderTable();
            });
        });
    });

    function loadBooks() {
        fetch("/api/admin/books", { credentials: "include" })
            .then(function (res) {
                if (res.status === 401 || res.status === 403) {
                    window.location.href = "/login";
                    throw new Error("Not authorized.");
                }
                if (!res.ok) throw new Error("Failed to load books.");
                return res.json();
            })
            .then(function (books) {
                allBooks = books;
                populateFilterOptions();
                renderStats();
                renderTable();
            })
            .catch(function (err) {
                console.error(err);
                document.getElementById("booksTableBody").innerHTML =
                    '<tr><td colspan="8" style="text-align:center;padding:30px;color:#c0503f;">Could not load books.</td></tr>';
            });
    }

    function populateFilterOptions() {
        const categorySelect = document.getElementById("categoryFilter");
        const languageSelect = document.getElementById("languageFilter");

        const categories = [...new Set(allBooks.map(b => b.category).filter(Boolean))].sort();
        const languages = [...new Set(allBooks.map(b => b.language).filter(Boolean))].sort();

        categorySelect.innerHTML = '<option value="">All Categories</option>' +
            categories.map(c => `<option value="${c}">${c}</option>`).join("");

        languageSelect.innerHTML = '<option value="">Language: All</option>' +
            languages.map(l => `<option value="${l}">${l}</option>`).join("");
    }

    function renderStats() {
        const total = allBooks.length;
        const published = allBooks.filter(b => b.status === "published").length;
        const draftPending = allBooks.filter(b => b.status !== "published").length;
        const draftCount = allBooks.filter(b => b.status === "draft").length;
        const scheduledCount = allBooks.filter(b => b.status === "scheduled").length;
        const premium = allBooks.filter(b => b.premium).length;

        document.getElementById("statTotal").textContent = total;
        document.getElementById("statTotalSub").textContent = total + " total in catalog";

        document.getElementById("statPublished").textContent = published;
        document.getElementById("statPublishedBar").style.width = (total ? (published / total * 100) : 0) + "%";
        document.getElementById("statPublishedSub").textContent =
            total ? Math.round(published / total * 100) + "% active" : "—";

        document.getElementById("statDraftPending").textContent = draftPending;
        document.getElementById("statDraftPendingSub").textContent =
            draftCount + " drafts · " + scheduledCount + " scheduled";

        document.getElementById("statPremium").textContent = premium;
        document.getElementById("statPremiumBar").style.width = (total ? (premium / total * 100) : 0) + "%";
        document.getElementById("statPremiumSub").textContent =
            total ? Math.round(premium / total * 100) + "% monetized" : "—";
    }

    function renderTable() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const category = document.getElementById("categoryFilter").value;
        const language = document.getElementById("languageFilter").value;
        const tbody = document.getElementById("booksTableBody");

        let filtered = allBooks.filter(function (b) {
            const matchesSearch = !search ||
                (b.title || "").toLowerCase().includes(search) ||
                (b.author || "").toLowerCase().includes(search);

            const matchesCategory = !category || b.category === category;
            const matchesLanguage = !language || b.language === language;

            let matchesFilter = true;
            if (activeStatusFilter === "premium") matchesFilter = b.premium;
            else if (activeStatusFilter === "free") matchesFilter = !b.premium;
            else if (activeStatusFilter !== "all") matchesFilter = b.status === activeStatusFilter;

            return matchesSearch && matchesCategory && matchesLanguage && matchesFilter;
        });

        document.getElementById("tableFooterText").textContent =
            "Showing " + filtered.length + " of " + allBooks.length + " books";

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">No books match this filter.</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(function (b) {
            const statusClass = b.status === "published" ? "status-published"
                : b.status === "draft" ? "status-draft" : "status-pending";
            const statusLabel = b.status ? (b.status.charAt(0).toUpperCase() + b.status.slice(1)) : "Draft";
            const priceCell = b.premium
                ? '<strong>Rs. ' + (b.price || 0) + '</strong><small>PREMIUM</small>'
                : '<strong>Free</strong><small>OPEN ACCESS</small>';
            const coverLabel = (b.category || "BOOK").substring(0, 6).toUpperCase();
            const coverClass = b.status === "draft" ? "cover-draft" : "cover-forest";

            return `
                <tr data-id="${b.id}">
                    <td><div class="cover-thumb ${coverClass}">${coverLabel}</div></td>
                    <td class="title-cell"><strong>${escapeHtml(b.title || "Untitled")}</strong><small>ID ${b.id}</small></td>
                    <td class="author-cell"><strong>${escapeHtml(b.author || "Unknown")}</strong></td>
                    <td><span class="category-pill">${escapeHtml(b.category || "General")}</span></td>
                    <td class="price-cell ${b.premium ? "premium" : "free"}">${priceCell}</td>
                    <td class="format-cell">${escapeHtml(b.type || "Book")}<small>${b.pageCount || 0} pgs</small></td>
                    <td><span class="status-pill ${statusClass}"><i class="fa-solid fa-circle"></i>${statusLabel}</span></td>
                    <td class="row-actions">
                        <button onclick="togglePublish(${b.id}, '${b.status}')" title="Toggle Published/Draft">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                        <button onclick="deleteBook(${b.id}, '${escapeHtml(b.title || "").replace(/'/g, "")}')" title="Delete" style="color:#c0503f;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function togglePublish(id, currentStatus) {
        const newStatus = currentStatus === "published" ? "draft" : "published";
        fetch("/api/admin/books/" + id + "/status", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ status: newStatus })
        })
            .then(function (res) {
                if (!res.ok) throw new Error("Failed to update status.");
                loadBooks();
            })
            .catch(function (err) { alert("Could not update status. " + err.message); });
    }

    function deleteBook(id, title) {
        if (!confirm('Delete "' + title + '"? This cannot be undone.')) return;

        fetch("/api/admin/books/" + id, { method: "DELETE", credentials: "include" })
            .then(function (res) {
                if (!res.ok) throw new Error("Failed to delete book.");
                loadBooks();
            })
            .catch(function (err) { alert("Could not delete the book. " + err.message); });
    }
</script>
