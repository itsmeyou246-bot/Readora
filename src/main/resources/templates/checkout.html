<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Checkout - Readora</title>

	<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
	>

	<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
	>

	<link
			rel="stylesheet"
			th:href="@{/css/checkout.css}"
	>
</head>

<body>

<header class="checkout-header legacy-chrome-header">
	<a th:href="@{/index}" href="/index.html" class="logo">
		READORA
	</a>

	<a th:href="@{/cart}" href="/cart.html">
		<i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
		Cart
		<span data-cart-count hidden>0</span>
	</a>
</header>

<main class="checkout-page">

	<div class="checkout-layout">

		<div
				id="orderSummary"
				class="order-summary"
		></div>

		<div class="checkout-right">

			<div class="eyebrow">
				Secure Checkout
			</div>

			<h1>
				Complete Your Purchase
			</h1>

			<div class="steps">

				<div class="step done">
                    <span class="step-circle">
                        <i class="fa-solid fa-check"></i>
                    </span>

					<small>
						Review
					</small>
				</div>

				<span class="step-line done"></span>

				<div class="step active">
                    <span class="step-circle">
                        2
                    </span>

					<small>
						Payment
					</small>
				</div>

				<span class="step-line"></span>

				<div class="step">
                    <span class="step-circle">
                        3
                    </span>

					<small>
						Confirmation
					</small>
				</div>

			</div>

			<form
					id="checkoutForm"
					class="checkout-form"
					novalidate
			>

				<section class="form-section">

					<h2>
						Customer Information
					</h2>

					<label for="fullName">
						Full Name

						<input
								id="fullName"
								type="text"
								autocomplete="name"
								required
						>
					</label>

					<label for="email">
						Email Address

						<input
								id="email"
								type="email"
								autocomplete="email"
								required
						>
					</label>

				</section>

				<section class="form-section payment-card">

					<h2>
						Select Payment Method
					</h2>

					<!--
						IMPORTANT:
						checkout.js only ever calls /api/payments/esewa/initiate,
						and PaymentController currently has no Khalti or FonePay
						service behind it. Showing those as selectable options
						was misleading — picking Khalti silently redirected to
						eSewa anyway. Only eSewa is enabled below until Khalti
						and FonePay have real backend endpoints.
					-->

					<div class="payment-options">

						<label>
							<input
									type="radio"
									name="paymentMethod"
									value="eSewa"
									checked
							>

							<span>
                                eSewa
                            </span>

							<i class="fa-solid fa-wallet"></i>
						</label>

						<label class="payment-option-disabled">
							<input
									type="radio"
									name="paymentMethod"
									value="Khalti"
									disabled
							>

							<span>
                                Khalti <small>(coming soon)</small>
                            </span>

							<i class="fa-solid fa-credit-card"></i>
						</label>

						<label class="payment-option-disabled">
							<input
									type="radio"
									name="paymentMethod"
									value="FonePay"
									disabled
							>

							<span>
                                FonePay <small>(coming soon)</small>
                            </span>

							<i class="fa-solid fa-qrcode"></i>
						</label>

					</div>

				</section>

				<p
						id="checkoutError"
						class="checkout-error"
						role="alert"
				></p>

				<button
						class="primary-button"
						type="submit"
				>
					<i class="fa-solid fa-lock"></i>

					<span data-pay-label>
                        Place Order
                    </span>
				</button>

			</form>

			<p class="secure-footnote">

                <span>
                    <i class="fa-solid fa-shield-halved"></i>
                    Secure Checkout
                </span>

				<span>
                    <i class="fa-regular fa-clock"></i>
                    24/7 Support
                </span>

			</p>

		</div>

	</div>

</main>

<style>
	.payment-option-disabled {
		opacity: .5;
		cursor: not-allowed;
	}
	.payment-option-disabled small {
		display: block;
		font-size: 10px;
		font-weight: 500;
		text-transform: none;
	}
</style>

<script
		th:src="@{/js/cart-utils.js}"
		src="/js/cart-utils.js"
></script>

<script
		th:src="@{/js/checkout.js}"
		src="/js/checkout.js"
></script>

</body>
</html>
